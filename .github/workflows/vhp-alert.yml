name: Opportunity alerts

# Every 10 minutes (GitHub may run it a few minutes late) check three opportunities.
# When one opens, an issue is created and assigned to you, and GitHub emails it.
# When it goes away, the issue closes with how long it lasted.
# Anti-spam: one open issue per type, a cooldown after each closes, and a daily cap.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: opportunity-alerts
  cancel-in-progress: false

env:
  VHP_EDGE_PCT: '5'        # buying VHP beats burning by at least this %
  LOOP_MIN_KOIN: '25'      # a loop returns at least this much extra KOIN
  XCHAIN_NET_PCT: '5'      # bridged KOIN price gap after pool fees, in %
  VHP_COOLDOWN_H: '1'      # hours to wait after an alert closes before the same type can alert again
  LOOP_COOLDOWN_H: '6'
  XCHAIN_COOLDOWN_H: '12'
  MAX_ALERTS_PER_DAY: '6'  # never more than this many new alert emails in 24 hours
  NOTIFY_USER: bawcejawn

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check opportunities and update alert issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-alerts.mjs
