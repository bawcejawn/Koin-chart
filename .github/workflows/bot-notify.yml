name: Bot notifications

# The bot (on your PC, or the paper test here) sends a repository_dispatch event; this posts it as an
# issue or comment from github-actions, which GitHub emails to you.
on:
  repository_dispatch:
    types: [bot-summary, bot-alert, bot-heartbeat]

permissions:
  issues: write
  contents: write

concurrency:
  group: bot-notify
  cancel-in-progress: false

jobs:
  status:
    # bot-heartbeat: store the bot's status on the bot-status branch (read by bot.html and the alert job)
    if: github.event.action == 'bot-heartbeat'
    runs-on: ubuntu-latest
    steps:
      - name: Write status
        env:
          STATUS: ${{ github.event.client_payload.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git clone -q --depth 1 --branch bot-status "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" s 2>/dev/null; then cd s; else mkdir s && cd s && git init -q -b bot-status && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; fi
          printf '%s' "$STATUS" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d);const fs=require("fs");
            fs.writeFileSync("status.json",JSON.stringify(s,null,2));
            let h=[];try{h=fs.readFileSync("history.jsonl","utf8").trim().split("\n").filter(Boolean)}catch(e){}
            h.push(JSON.stringify({at:s.at,koin:s.koin,vhp:s.vhp,paused:s.paused,lag:s.node&&s.node.lagSec,today:s.today}));
            fs.writeFileSync("history.jsonl",h.slice(-400).join("\n")+"\n")})'
          git add status.json history.jsonl
          git commit -q -m "status $(date -u +%FT%TZ)" || exit 0
          git push -q origin bot-status
  post:
    if: github.event.action != 'bot-heartbeat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          NOTIFY_USER: bawcejawn
        with:
          script: |
            const p = context.payload.client_payload || {};
            const kind = context.payload.action; // bot-summary | bot-alert
            const user = process.env.NOTIFY_USER;
            const { owner, repo } = context.repo;
            const label = kind === 'bot-summary' ? 'bot-daily' : 'bot-topup';
            await github.rest.issues.createLabel({ owner, repo, name: label, color: kind === 'bot-summary' ? '5c6bc0' : 'ef6c00' }).catch(() => {});
            const title = String(p.title || 'Bot message').slice(0, 200);
            const body = `@${user} ${String(p.body || '').slice(0, 60000)}`;
            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 })).data;
            if (kind === 'bot-summary') {
              // one running issue; each day is a comment (each comment emails you)
              const issue = open[0] || (await github.rest.issues.create({ owner, repo, title: 'Bot daily summaries', labels: [label], assignees: [user], body: `@${user} Daily bot summaries arrive here as comments at 8 AM ET.` })).data;
              const recent = (await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 })).data;
              if (recent.some(c => c.body.startsWith(`### ${title}\n`))) { core.info('already posted today'); return; }
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `### ${title}\n\n${body}` });
            } else if (open[0]) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `### ${title}\n\n${body}` });
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, title });
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], assignees: [user], body: `${body}\n\nClose this issue once you've topped up.` });
            }
