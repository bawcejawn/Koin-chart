name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
  pool-contract:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts/pool } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Built wasm matches the committed one
        run: git diff --exit-code -- build/release/pool.wasm || (echo "::warning::pool.wasm differs from the committed build"; exit 0)
  local-chain:
    # Full end-to-end test on a private Koinos chain in Docker: tokens, pool contract, liquidity, swaps, fees
    runs-on: ubuntu-latest
    needs: pool-contract
    env:
      JSONRPC_TAG: v1.0.0   # local-koinos 0.4.16 ships ".env" with a typo ("v1.0.0.")
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: docker-compose shim (local-koinos calls the v1 command)
        run: |
          if ! command -v docker-compose >/dev/null; then printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null; sudo chmod +x /usr/local/bin/docker-compose; fi
          docker-compose version
      - name: Pin RabbitMQ 3.13 (RabbitMQ 4 refuses the queues Koinos uses)
        run: docker pull -q rabbitmq:3.13-alpine && docker tag rabbitmq:3.13-alpine rabbitmq:alpine
      - run: npm ci --no-audit --no-fund
        working-directory: integration
      - run: npm test
        working-directory: integration
        timeout-minutes: 15
        env:
          KEEP_NODE: '1'        # leave the chain up for the page test
      - name: Pools page test (drives pools.html against the same chain)
        run: node page.js
        working-directory: integration
        timeout-minutes: 10
        env: { KEEP_NODE: '1' }
      - name: Bot Guard attack test (a scam token tries to rob the trader)
        if: always()
        run: (cd ../bot && npm install --no-audit --no-fund --silent) && node guard.js
        working-directory: integration
        timeout-minutes: 10
      - name: Node logs (on failure)
        if: failure()
        run: docker compose -p localkoinos logs --tail 60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: local-chain-report, path: 'integration/*report.json', if-no-files-found: ignore }
