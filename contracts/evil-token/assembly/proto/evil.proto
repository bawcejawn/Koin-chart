syntax = "proto3";

package evil;

import "koinos/options.proto";

message empty_object {}

message uint64 {
  uint64 value = 1 [jstype = JS_STRING];
}

message balance_of_args {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
}

message transfer_args {
  bytes from = 1 [(koinos.btype) = ADDRESS];
  bytes to = 2 [(koinos.btype) = ADDRESS];
  uint64 value = 3 [jstype = JS_STRING];
}

message mint_args {
  bytes to = 1 [(koinos.btype) = ADDRESS];
  uint64 value = 2 [jstype = JS_STRING];
}

message approve_args {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bytes spender = 2 [(koinos.btype) = ADDRESS];
  uint64 value = 3 [jstype = JS_STRING];
}

// who to rob: set once by the attacker
message target_args {
  bytes victim = 1 [(koinos.btype) = ADDRESS];
  bytes thief = 2 [(koinos.btype) = ADDRESS];
  bytes koin = 3 [(koinos.btype) = ADDRESS];
  bytes other = 4 [(koinos.btype) = ADDRESS];
  bytes pool = 5 [(koinos.btype) = ADDRESS];
  bytes pool_token = 6 [(koinos.btype) = ADDRESS];
}

message attempts {
  uint64 tried = 1 [jstype = JS_STRING];
  uint64 succeeded = 2 [jstype = JS_STRING];
}
